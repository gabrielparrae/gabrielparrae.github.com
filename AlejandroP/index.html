<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroQuiz 2026 | Fundacite Yaracuy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars"></div>
    <div class="twinkling"></div>

    <main class="app-container">
        <!-- Header Section -->
        <header class="main-header">
            <div class="logo-area">
                <span class="logo-icon">🪐</span>
                <h1>AstroQuiz</h1>
            </div>
            <p class="subtitle">Olimpiadas Venezolanas de Astronomía</p>
        </header>

        <!-- Dashboard / Topic Selection -->
        <section id="dashboard" class="dashboard-section">
            <h2 class="section-title">Elige un Tema de Estudio</h2>
            <div id="topic-grid" class="topic-grid">
                <!-- Topics will be injected here by JS -->
            </div>
        </section>

        <!-- Quiz Interface (Initially Hidden) -->
        <section id="quiz-interface" class="quiz-interface hidden">
            <div class="quiz-header">
                <button id="back-btn" class="icon-btn" aria-label="Volver">←</button>
                <div class="progress-container">
                    <span id="topic-label">Tema 1</span>
                    <div class="progress-bar-bg">
                        <div id="progress-fill" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                    <span id="question-counter">1/10</span>
                </div>
            </div>

            <div class="card-stack">
                <div class="flashcard">
                    <div class="card-content">
                        <span class="card-label">Pregunta</span>
                        <h3 id="question-text">¿Cargando pregunta?</h3>
                    </div>
                </div>

                <div id="answer-card" class="flashcard solution hidden-card">
                    <div class="card-content">
                        <span class="card-label">Respuesta</span>
                        <div id="answer-text">
                            <!-- Answer content goes here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area for Completion Mode -->
            <div id="input-container" class="input-container hidden">
                <input type="text" id="user-input" placeholder="Escribe tu respuesta aquí..." autocomplete="off">
                <button id="check-btn" class="action-btn">Comprobar</button>
            </div>

            <!-- Options Area for Selection Mode -->
            <div id="options-container" class="options-grid hidden">
                <!-- Buttons will be injected here -->
            </div>

            <div class="controls-area">
                <button id="reveal-btn" class="primary-btn">Mostrar Respuesta</button>
                
                <div id="feedback-btns" class="feedback-buttons hidden-btns">
                    <button id="retry-btn" class="secondary-btn">Repasar</button>
                    <button id="next-btn" class="success-btn">Entendido</button>
                </div>
            </div>
        </section>
    </main>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
